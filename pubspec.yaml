name: buy_verse_app
description: "Join BuyVerse and step into the future of digital commerce! Whether you’re hunting for the best deals on things you love or ready to turn your own items into real profit, BuyVerse gives you a smart, secure, and lightning-fast platform that connects buyers and sellers in one vibrant community"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_splash_screen: ^1.3.0
  lottie: ^3.3.1
  hexcolor: ^3.0.1
  gap: ^3.0.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  flutter_launcher_icons: ^0.14.4
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.0
  form_builder_image_picker: ^4.3.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  icons_flutter: ^0.0.5
  firebase_analytics: ^12.0.3
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^18.0.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.13.1
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.16.0
  email_otp: ^2.0.1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  shared_preferences: ^2.5.2
  geocoding: ^3.0.0
  dio: ^5.7.0
  flutter_dotenv: ^5.1.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  infinite_scroll_pagination: ^4.0.0
  path_provider: ^2.1.3
  dartz: ^0.10.1
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/e-commerce.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - .env
